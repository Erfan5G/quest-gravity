[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-gravity-portfolio"
version = "0.1.0"
description = "Audited Python analysis of Geoscience BC QUEST airborne gravity"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "rasterio>=1.3,<2", "pyproj>=3.6,<4"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]
report = ["reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
